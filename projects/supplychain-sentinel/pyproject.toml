[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplychain-sentinel"
version = "0.1.0"
description = "Explainable Python dependency vulnerability scanner with OSV, SARIF and CycloneDX output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhijithbs-dev" }]
keywords = ["security", "devsecops", "osv", "sbom", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
