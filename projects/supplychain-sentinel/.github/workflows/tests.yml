name: tests

on:
  push:
    paths:
      - "projects/supplychain-sentinel/**"
  pull_request:
    paths:
      - "projects/supplychain-sentinel/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/supplychain-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
